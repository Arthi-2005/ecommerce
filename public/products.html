<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - StockMart</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>
  <!-- Navigation -->
  <nav class="navbar glass-nav">
    <div class="nav-brand">
      <i class="fas fa-chart-line pulse-icon"></i>
      <span class="gradient-text brand-name">StockMart</span>
    </div>
    <div class="nav-search">
      <form onsubmit="event.preventDefault();window.location.href='products.html?search='+encodeURIComponent(this.querySelector('input').value)">
        <i class="fas fa-search nav-search-icon"></i>
        <input type="text" placeholder="Search products..." class="nav-search-input">
      </form>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
      <a href="products.html" class="nav-link active"><i class="fas fa-shopping-bag"></i> Products</a>
      <a href="cart.html" class="nav-link"><i class="fas fa-shopping-cart"></i> Cart <span class="cart-badge" id="cartBadge">0</span></a>
      <a href="orders.html" class="nav-link"><i class="fas fa-receipt"></i> Orders</a>
      <a href="analytics.html" class="nav-link"><i class="fas fa-chart-bar"></i> Analytics</a>
      <a href="invest.html" class="nav-link"><i class="fas fa-coins"></i> Invest</a>
      <a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="login.html" class="nav-link btn-glow" id="loginBtn"><i class="fas fa-user"></i> Login</a>
    </div>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html" class="mobile-link"><i class="fas fa-home"></i> Home</a>
    <a href="products.html" class="mobile-link active"><i class="fas fa-shopping-bag"></i> Products</a>
    <a href="cart.html" class="mobile-link"><i class="fas fa-shopping-cart"></i> Cart</a>
    <a href="orders.html" class="mobile-link"><i class="fas fa-receipt"></i> Orders</a>
    <a href="analytics.html" class="mobile-link"><i class="fas fa-chart-bar"></i> Analytics</a>
    <a href="invest.html" class="mobile-link"><i class="fas fa-coins"></i> Invest</a>
    <a href="dashboard.html" class="mobile-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="login.html" class="mobile-link"><i class="fas fa-user"></i> Login</a>
  </div>

  <!-- Page Header -->
  <section class="page-header">
    <h1 class="gradient-text fade-in"><i class="fas fa-shopping-bag"></i> Products Marketplace</h1>
    <p class="fade-in">800+ products with stock market analytics</p>
  </section>

  <!-- Filters -->
  <section class="filters-section glass-card">
    <div class="container">
      <div class="filters-grid">
        <div class="filter-group">
          <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Search products...">
        </div>
        <div class="filter-group">
          <select id="categoryFilter" class="filter-select">
            <option value="">All Categories</option>
          </select>
        </div>
        <div class="filter-group">
          <select id="sortFilter" class="filter-select">
            <option value="id">Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="stock_change_percent-desc">Stock: Top Gainers</option>
            <option value="stock_change_percent-asc">Stock: Top Losers</option>
            <option value="rating-desc">Rating: High to Low</option>
            <option value="volume-desc">Volume: Highest</option>
            <option value="market_cap-desc">Market Cap: Highest</option>
          </select>
        </div>
        <div class="filter-group">
          <select id="viewMode" class="filter-select" onchange="toggleView(this.value)">
            <option value="grid">Grid View</option>
            <option value="list">List View</option>
          </select>
        </div>
      </div>
      <div class="filter-tags" id="filterTags"></div>
    </div>
  </section>

  <!-- Products Grid -->
  <section class="products-section">
    <div class="container">
      <div class="results-info">
        <span id="resultsCount">Loading...</span>
        <div class="view-toggles">
          <button class="view-btn active" onclick="toggleView('grid')"><i class="fas fa-th"></i></button>
          <button class="view-btn" onclick="toggleView('list')"><i class="fas fa-list"></i></button>
        </div>
      </div>
      <div class="products-grid" id="productsGrid">
        <!-- Filled by JS -->
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </section>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal glass-card">
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      <div class="modal-content" id="modalContent">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <footer class="footer glass-card">
    <div class="footer-bottom">
      <p>&copy; 2026 StockMart. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
